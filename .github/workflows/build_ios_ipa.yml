name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          echo "Selecting Xcode 16..."
          if [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          fi
          xcodebuild -version

      - name: Fix version target and concurrency for iOS
        run: |
          sed -i '' 's/iOS: "26.1"/iOS: "18.0"/g' ios/project.yml
          sed -i '' 's/xcodeVersion: "26.6"/xcodeVersion: "16.1"/g' ios/project.yml
          sed -i '' 's/SWIFT_STRICT_CONCURRENCY: complete/SWIFT_STRICT_CONCURRENCY: minimal/g' ios/project.yml
          sed -i '' 's/\.iOS(\.v26)/\.iOS(\.v18)/g' JetlinkKit/Package.swift
          sed -i '' 's/swift-tools-version: 6.2/swift-tools-version: 6.0/g' JetlinkKit/Package.swift
          sed -i '' 's/public static func downloadingText/nonisolated public static func downloadingText/g' JetlinkKit/Sources/JetlinkUI/ModelStatusLabel.swift

      - name: Install build tools
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          make -C ios project

      - name: Build App (Unsigned)
        run: |
          xcodebuild build \
            -project ios/Jetlink.xcodeproj \
            -scheme Jetlink \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath ios/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package to IPA
        run: |
          mkdir -p Payload
          cp -r ios/build/DerivedData/Build/Products/Release-iphoneos/Jetlink.app Payload/
          zip -r Jetlink.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jetlink_ipa
          path: Jetlink.ipa
          retention-days: 7
